services:
  postgres:
    image: postgres:16-alpine
    container_name: tensorcade-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: tensorcade
      POSTGRES_PASSWORD: tensorcade_dev_secret
      POSTGRES_DB: tensorcade
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    image: redis:7-alpine
    container_name: tensorcade-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command:
      [
        'redis-server',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'volatile-lru',
        '--appendonly',
        'yes',
      ]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
